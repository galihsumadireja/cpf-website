<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Survey Kemitraan – Customer</title>
  <link rel="stylesheet" href="../../css/cpf-style.css">
</head>
<body>

<div class="container">

  <section id="intro">
    <h2>Survey Kemitraan Customer</h2>
    <p><strong>7 pertanyaan skala</strong> (wajib) dan <strong>2 refleksi</strong> (opsional).</p>
    <button onclick="startSurvey()">Mulai Survey</button>
  </section>

  <section id="survey" style="display:none;">
    <form id="surveyForm"></form>
    <button onclick="goToReflection()">Lanjut</button>
  </section>

  <section id="reflection" style="display:none;">
    <h3>Pertanyaan Refleksi (Opsional)</h3>

    <label>1. Hal paling memuaskan / kurang memuaskan?</label>
    <textarea id="oe1"></textarea>

    <label>2. Nilai utama PML / perbaikan?</label>
    <textarea id="oe2"></textarea>

    <button onclick="submitSurvey()">Kirim Jawaban</button>
  </section>

  <section id="thanks" style="display:none;">
    <h3>Terima kasih</h3>
  </section>

</div>

<script>
const SUPABASE_URL = "https://XXXXX.supabase.co";
const SUPABASE_KEY = "ANON_KEY_KAMU";

const token = new URLSearchParams(location.search).get("token") || "NO_TOKEN";

const QUEST = [
  ["Q17","Customer Satisfaction"],
  ["Q18","Customer Satisfaction"],
  ["Q19","Customer Satisfaction"],
  ["Q20","Customer Satisfaction"],
  ["Q21","Customer Loyalty"],
  ["Q22","Customer Loyalty"],
  ["Q23","Customer Loyalty"]
];

const form = document.getElementById("surveyForm");

function startSurvey(){
  intro.style.display="none";
  survey.style.display="block";
  QUEST.forEach((q,i)=>{
    form.innerHTML+=`<p>Soal ${i+1}</p>`+[1,2,3,4,5].map(v=>`<label><input type=radio name=${q[0]} value=${v}>${v}</label>`).join(" ");
  });
}

function goToReflection(){
  for(const q of QUEST) if(!form[q[0]].value) return alert("Lengkapi semua");
  survey.style.display="none";
  reflection.style.display="block";
}

async function submitSurvey(){
  await fetch(`${SUPABASE_URL}/rest/v1/cpf_survey_responses`,{
    method:"POST",
    headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
    body:JSON.stringify(QUEST.map(q=>({
      survey_type:"customer",token,cpf_stage:q[1],question_id:q[0],
      value:Number(form[q[0]].value),submitted_at:new Date()
    })))
  });

  await fetch(`${SUPABASE_URL}/rest/v1/cpf_survey_reflections`,{
    method:"POST",
    headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
    body:JSON.stringify([
      {survey_type:"customer",token,question_id:"OE1",answer_text:oe1.value,submitted_at:new Date()},
      {survey_type:"customer",token,question_id:"OE2",answer_text:oe2.value,submitted_at:new Date()}
    ])
  });

  reflection.style.display="none";
  thanks.style.display="block";
}
</script>
</body>
</html>
