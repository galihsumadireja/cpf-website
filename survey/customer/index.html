<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Survey Customer – CPF</title>

  <!-- ✅ CSS WAJIB (INI KUNCI, JANGAN DIUBAH) -->
  <link rel="stylesheet" href="../../css/cpf-style.css">
</head>

<body>

<div class="container">

  <h2>Survey Customer (CPF)</h2>

  <p class="note">
    Silakan beri penilaian 1–5.<br>
    1 = Sangat Tidak Setuju, 5 = Sangat Setuju
  </p>

  <form id="surveyForm">

    <label>Q17</label>
    <input type="number" min="1" max="5" name="Q17" required>

    <label>Q18</label>
    <input type="number" min="1" max="5" name="Q18" required>

    <label>Q19</label>
    <input type="number" min="1" max="5" name="Q19" required>

    <label>Q20</label>
    <input type="number" min="1" max="5" name="Q20" required>

    <label>Q21</label>
    <input type="number" min="1" max="5" name="Q21" required>

    <label>Q22</label>
    <input type="number" min="1" max="5" name="Q22" required>

    <label>Q23</label>
    <input type="number" min="1" max="5" name="Q23" required>

    <button type="button" onclick="submitSurvey()">Kirim Jawaban</button>
  </form>

  <div id="status" class="note"></div>

</div>

<script>
/* ================= SUPABASE CONFIG ================= */
const SUPABASE_URL = "https://XXXXX.supabase.co";        // GANTI
const SUPABASE_ANON_KEY = "ANON_PUBLIC_KEY_KAMU";        // GANTI
const TABLE = "cpf_survey_responses";

/* ================= TOKEN ================= */
const token = new URLSearchParams(window.location.search).get("token") || "NO_TOKEN";

/* ================= QUESTIONS ================= */
const QUESTIONS = [
  { id: "Q17", stage: "Customer Satisfaction" },
  { id: "Q18", stage: "Customer Satisfaction" },
  { id: "Q19", stage: "Customer Satisfaction" },
  { id: "Q20", stage: "Customer Satisfaction" },
  { id: "Q21", stage: "Customer Loyalty" },
  { id: "Q22", stage: "Customer Loyalty" },
  { id: "Q23", stage: "Customer Loyalty" }
];

/* ================= SUBMIT ================= */
async function submitSurvey() {
  const form = document.getElementById("surveyForm");
  const rows = [];

  for (const q of QUESTIONS) {
    rows.push({
      survey_type: "customer",
      token: token,
      cpf_stage: q.stage,
      question_id: q.id,
      value: Number(form[q.id].value),
      submitted_at: new Date().toISOString()
    });
  }

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(rows)
    });

    if (!res.ok) throw new Error();

    document.getElementById("status").innerText =
      "✅ Jawaban berhasil disimpan. Terima kasih.";
  } catch {
    document.getElementById("status").innerText =
      "❌ Gagal mengirim data.";
  }
}
</script>

</body>
</html>
