<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Survey Kemitraan – Customer</title>
  <link rel="stylesheet" href="../../css/c<div class="container">

  <!-- INTRO -->
  <section id="intro">
    <h2>Survey Kemitraan Customer</h2>
    <p><strong>7 pertanyaan skala</strong> (wajib) dan <strong>2 refleksi</strong> (opsional).</p>
    <button type="button" onclick="startSurvey()">Mulai Survey</button>
  </section>

  <!-- SKALA -->
  <section id="survey" style="display:none;">
    <p class="note">
      1 = Sangat Tidak Setuju · 5 = Sangat Setuju
    </p>
    <form id="surveyForm"></form>
    <button type="button" onclick="goToReflection()">Lanjut</button>
  </section>

  <!-- REFLEKSI -->
  <section id="reflection" style="display:none;">
    <h3>Pertanyaan Refleksi (Opsional)</h3>

    <div class="field">
      <label for="oe1">
        1. Apa satu hal yang paling membuat Anda merasa puas atau kurang puas
        dengan layanan PML? Mohon ceritakan alasannya.
      </label>
      <textarea id="oe1" rows="4" style="width:100%;"></textarea>
    </div>

    <div class="field">
      <label for="oe2">
        2. Jika Anda harus merekomendasikan PML kepada rekan atau kolega Anda,
        nilai utama apa yang akan Anda sampaikan? Jika tidak, apa yang harus kami perbaiki?
      </label>
      <textarea id="oe2" rows="4" style="width:100%;"></textarea>
    </div>

    <button type="button" onclick="submitSurvey()">Kirim Jawaban</button>
  </section>

  <!-- THANK YOU -->
  <section id="thanks" style="display:none;">
    <h3>Terima kasih</h3>
    <p>Masukan Anda sangat berarti bagi kami.</p>
  </section>

</div>

<script>
/* ===== SUPABASE ===== */
const SUPABASE_URL = "https://XXXXX.supabase.co";   // GANTI
const SUPABASE_KEY = "ANON_KEY_KAMU";                // GANTI

const token = new URLSearchParams(location.search).get("token") || "NO_TOKEN";

const QUESTIONS = [
  ["Q17","Customer Satisfaction"],
  ["Q18","Customer Satisfaction"],
  ["Q19","Customer Satisfaction"],
  ["Q20","Customer Satisfaction"],
  ["Q21","Customer Loyalty"],
  ["Q22","Customer Loyalty"],
  ["Q23","Customer Loyalty"]
];

const form = document.getElementById("surveyForm");

/* ===== FLOW ===== */
function startSurvey(){
  document.getElementById("intro").style.display="none";
  document.getElementById("survey").style.display="block";

  form.innerHTML="";
  QUESTIONS.forEach((q,i)=>{
    form.innerHTML+=`
      <p><strong>Soal ${i+1}</strong></p>
      ${[1,2,3,4,5].map(v=>`
        <label><input type="radio" name="${q[0]}" value="${v}"> ${v}</label>
      `).join(" ")}
      <hr>
    `;
  });
}

function goToReflection(){
  for(const q of QUESTIONS){
    if(!form[q[0]].value){
      alert("Semua pertanyaan skala wajib dijawab.");
      return;
    }
  }
  document.getElementById("survey").style.display="none";
  document.getElementById("reflection").style.display="block";
}

/* ===== SUBMIT ===== */
async function submitSurvey(){
  const rows = QUESTIONS.map(q=>({
    survey_type:"customer",
    token:token,
    cpf_stage:q[1],
    question_id:q[0],
    value:Number(form[q[0]].value),
    submitted_at:new Date().toISOString()
  }));

  await fetch(`${SUPABASE_URL}/rest/v1/cpf_survey_responses`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Accept":"application/json",
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Prefer":"return=minimal"
    },
    body:JSON.stringify(rows)
  });

  const oe1Text = document.getElementById("oe1").value;
  const oe2Text = document.getElementById("oe2").value;

  await fetch(`${SUPABASE_URL}/rest/v1/cpf_survey_reflections`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Prefer":"return=minimal"
    },
    body:JSON.stringify([
      {survey_type:"customer", token, question_id:"OE1", answer_text:oe1Text, submitted_at:new Date()},
      {survey_type:"customer", token, question_id:"OE2", answer_text:oe2Text, submitted_at:new Date()}
    ])
  });

  document.getElementById("reflection").style.display="none";
  document.getElementById("thanks").style.display="block";
}
</script>

</body>
</html>
