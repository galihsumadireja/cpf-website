<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Survey Customer – CPF</title>
  ../css/cpf-style.css
</head>
<body>

<div class="container">

  <h2>Survey Customer (CPF)</h2>

  <form id="surveyForm"></form>

  <button onclick="submitSurvey()">Kirim Jawaban</button>
  <div id="status" class="note"></div>

</div>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "GANTI_DENGAN_SUPABASE_URL";
const SUPABASE_ANON_KEY = "GANTI_DENGAN_ANON_KEY";
const TABLE = "cpf_survey_responses";

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

/* ================= QUESTIONS ================= */
const QUESTIONS = [
  { id:"Q17", stage:"Customer Satisfaction" },
  { id:"Q18", stage:"Customer Satisfaction" },
  { id:"Q19", stage:"Customer Satisfaction" },
  { id:"Q20", stage:"Customer Satisfaction" },
  { id:"Q21", stage:"Customer Loyalty" },
  { id:"Q22", stage:"Customer Loyalty" },
  { id:"Q23", stage:"Customer Loyalty" }
];

/* ================= RENDER ================= */
const form = document.getElementById("surveyForm");
QUESTIONS.forEach(q => {
  form.innerHTML += `
    <p><strong>${q.id}</strong></p>
    <input type="number" min="1" max="5" name="${q.id}" required>
  `;
});

/* ================= SUBMIT ================= */
async function submitSurvey() {
  const rows = [];

  QUESTIONS.forEach(q => {
    const value = Number(form[q.id].value);
    rows.push({
      survey_type: "customer",
      token: token,
      cpf_stage: q.stage,
      question_id: q.id,
      value: value,
      submitted_at: new Date().toISOString()
    });
  });

  const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
    },
    body: JSON.stringify(rows)
  });

  document.getElementById("status").innerText =
    res.ok ? "✅ Jawaban tersimpan" : "❌ Gagal mengirim data";
}
</script>

</body>
</html>
