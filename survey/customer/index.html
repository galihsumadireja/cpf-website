<script>
/* ================= SUBMIT ================= */
async function submitSurvey() {
  try {
    // 1. KIRIM LIKERT
    const rowsLikert = QUESTIONS.map(q => ({
      survey_type: "customer",
      token: token,
      cpf_stage: q.stage,
      question_id: q.id,
      value: Number(form[q.id].value),
      submitted_at: new Date().toISOString()
    }));

    const resLikert = await fetch(`${SUPABASE_URL}/rest/v1/cpf_survey_responses`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(rowsLikert)
    });

    if (!resLikert.ok) {
      alert("Gagal menyimpan jawaban skala (Likert).");
      console.error(await resLikert.text());
      return;
    }

    // 2. KIRIM REFLEKSI (OPSIONAL)
    const oe1Text = document.getElementById("oe1").value || "";
    const oe2Text = document.getElementById("oe2").value || "";

    const resReflection = await fetch(`${SUPABASE_URL}/rest/v1/cpf_survey_reflections`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify([
        {
          survey_type: "customer",
          token: token,
          question_id: "OE1",
          answer_text: oe1Text,
          submitted_at: new Date().toISOString()
        },
        {
          survey_type: "customer",
          token: token,
          question_id: "OE2",
          answer_text: oe2Text,
          submitted_at: new Date().toISOString()
        }
      ])
    });

    if (!resReflection.ok) {
      alert("Jawaban skala tersimpan, tetapi refleksi gagal disimpan.");
      console.error(await resReflection.text());
      return;
    }

    // 3. SUKSES → PINDAH HALAMAN
    document.getElementById("reflection").style.display = "none";
    document.getElementById("thanks").style.display = "block";

  } catch (err) {
    console.error(err);
    alert("Terjadi kesalahan teknis saat mengirim jawaban.");
  }
}
</script>
