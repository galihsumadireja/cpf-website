<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Survey Crew – CPF</title>
  ../css/cpf-style.css
</head>
<body>

<div class="container">

  <h2>Survey Crew (CPF)</h2>

  <form id="surveyForm"></form>

  <button onclick="submitSurvey()">Kirim Jawaban</button>

  <div id="status" class="note"></div>

</div>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "GANTI_DENGAN_SUPABASE_URL";
const SUPABASE_ANON_KEY = "GANTI_DENGAN_ANON_KEY";
const TABLE = "cpf_survey_responses";

/* ================= TOKEN ================= */
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

/* ================= QUESTIONS ================= */
const QUESTIONS = [
  { id:"Q1", stage:"Crew Experience" },
  { id:"Q2", stage:"Crew Experience" },
  { id:"Q3", stage:"Crew Experience" },
  { id:"Q4", stage:"Crew Experience" },
  { id:"Q5", stage:"Crew Experience" },
  { id:"Q6", stage:"Crew Experience" },
  { id:"Q7", stage:"Crew Engagement" },
  { id:"Q8", stage:"Crew Engagement" },
  { id:"Q9", stage:"Crew Engagement" },
  { id:"Q10", stage:"Crew Engagement" },
  { id:"Q11", stage:"Crew Engagement" },
  { id:"Q12", stage:"Performance Citizenship" },
  { id:"Q13", stage:"Performance Citizenship" },
  { id:"Q14", stage:"Performance Citizenship" },
  { id:"Q15", stage:"Performance Citizenship" },
  { id:"Q16", stage:"Performance Citizenship" },
  { id:"Q24", stage:"Crew Prosperity" },
  { id:"Q25", stage:"Crew Prosperity" },
  { id:"Q26", stage:"Crew Prosperity" },
  { id:"Q27", stage:"Crew Prosperity" }
];

/* ================= RENDER ================= */
const form = document.getElementById("surveyForm");
QUESTIONS.forEach(q => {
  form.innerHTML += `
    <p><strong>${q.id}</strong></p>
    <input type="number" min="1" max="5" name="${q.id}" required>
  `;
});

/* ================= SUBMIT ================= */
async function submitSurvey() {
  const rows = [];

  QUESTIONS.forEach(q => {
    const value = Number(form[q.id].value);
    rows.push({
      survey_type: "crew",
      token: token,
      cpf_stage: q.stage,
      question_id: q.id,
      value: value,
      submitted_at: new Date().toISOString()
    });
  });

  const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
    },
    body: JSON.stringify(rows)
  });

  document.getElementById("status").innerText =
    res.ok ? "✅ Jawaban tersimpan" : "❌ Gagal mengirim data";
}
</script>

</body>
</html>
